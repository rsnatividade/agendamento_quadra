<mat-card style="max-width: 50vh; margin: auto; padding: 15px;">
    <div>
        <mat-form-field style="display: block;">
            <input matInput id="nomeUsuario" placeholder="Nome do Usuário" [(ngModel)]="nome" />
        </mat-form-field>
        <mat-form-field style="display: block;">
            <input matInput id="emailUsuario" placeholder="E-mail do Usuário" [(ngModel)]="email" />
        </mat-form-field>
        <button id="actionButton" mat-stroked-button (click)="gravarUsuario()">Gravar</button>
    </div>
    <div>
        <table mat-table [dataSource]="dataSource">
            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef>ID</th>
                <td mat-cell *matCellDef="let element">{{element.id}}</td>
            </ng-container>
            <ng-container matColumnDef="nome">
                <th mat-header-cell *matHeaderCellDef>Nome</th>
                <td mat-cell *matCellDef="let element">{{element.nome}}</td>
            </ng-container>
            <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef>E-mail</th>
                <td mat-cell *matCellDef="let element">{{element.email}}</td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </div>
</mat-card>
