<mat-card style="max-width: 50vh; margin: auto; padding: 15px;">
    <div>
        <mat-form-field style="display: block;">
            <mat-select [(ngModel)]="selectedQuadra">
                <mat-option *ngFor="let quadra of quadras" [value]="quadra">{{quadra.nome}}</mat-option>
            </mat-select>
        </mat-form-field>
        <mat-form-field style="display: block;">
            <input matInput [matDatepicker]="picker">
            <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
        <button id="actionButton" mat-stroked-button (click)="agendarReserva()">Reservar</button>
    </div>
    <div>
        <table mat-table [dataSource]="dataSource">
            <ng-container matColumnDef="hora">
              <th mat-header-cell *matHeaderCellDef>Hora</th>
              <td mat-cell *matCellDef="let element">{{element.hora}}</td>
            </ng-container>
            <ng-container matColumnDef="usuario">
              <th mat-header-cell *matHeaderCellDef>Usuário</th>
              <td mat-cell *matCellDef="let element">{{element.usuario}}</td>
            </ng-container>
            <ng-container matColumnDef="observacao">
                <th mat-header-cell *matHeaderCellDef>Observação</th>
                <td mat-cell *matCellDef="let element">{{element.observacao}}</td>
              </ng-container>
              <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>      
    </div>
</mat-card>
